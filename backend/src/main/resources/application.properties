spring.config.import=optional:file:.env[.properties], optional:file:backend/.env[.properties]

spring.application.name=AI-Revenue-Recovery

# Environment variable mappings with safe fallback defaults
spring.datasource.url=jdbc:mysql://localhost:3306/revenue_recovery_db
spring.datasource.username=root
spring.datasource.password=Yashit@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.session.jdbc.initialize-schema=always

# JPA/Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# Spring AI Google GenAI
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.1-flash-lite

# Task Scheduling
spring.task.scheduling.pool.size=2

#Meta
whatsapp.access-token=${WHATSAPP_API_ACCESS_TOKEN}
whatsapp.phone-number-id=${WHATSAPP_API_PHONE_NUMBER_ID}
whatsapp.graph-api-version=${WHATSAPP_API_GRAPH_API_VERSION}

